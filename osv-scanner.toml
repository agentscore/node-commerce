# OSV-Scanner allowlist. Each entry must document why the advisory is not
# exploitable in this codebase. Keep this list minimal and revisit on review.

# zod 3.25.76: GHSA-mrhx-c7xc-m3w5 covers every release below 4.6.6 and no 3.x
# fix exists. This copy is the dev tree's, required at ^3 by the x402 and
# cdp-sdk packages the tests and examples install; their latest releases still
# require zod ^3. It is not in the published package: the build bundles only
# mppx's own zod 4 (dist source maps list mppx/node_modules/zod and nothing
# else), and that copy is on a fixed 4.x. The entry is scoped to 3.25.76, so a
# zod 4 regression still fails the scan. Lift when those packages accept zod 4.
[[PackageOverrides]]
name = "zod"
version = "3.25.76"
ecosystem = "npm"
effectiveUntil = 2027-01-24
vulnerability.ignore = true
reason = "GHSA-mrhx-c7xc-m3w5 has no zod 3.x fix and the x402 and cdp-sdk dev dependencies still require zod ^3. The published bundle carries only mppx's zod 4.6.7."

# minimatch: GHSA-g3hv-75wg-m249 (DoS through globparts amplification) is fixed
# only in 11.0.1; no 10.x release carries it. Every copy in this lock is lint
# tooling (eslint and its config-array, typescript-eslint's typescript-estree,
# eslint-plugin-import-x) matching patterns we write ourselves, and none of it
# ships in the published package. Their ^10 ranges do not admit 11. Remove the
# entry when its parents' latest releases admit 11.
[[PackageOverrides]]
name = "minimatch"
version = "10.2.6"
ecosystem = "npm"
effectiveUntil = 2027-01-31
vulnerability.ignore = true
reason = "No fixed 10.x; pulled at ^10 by eslint, @eslint/config-array, typescript-estree and eslint-plugin-import-x; lint tooling only, not in the published package."
